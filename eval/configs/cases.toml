# ---------------------------------------------------------------------------
# stress-ng VM / fork / mprotect throughput (1-core and 2-core)
# Note: stress-ng 0.18.06 has no pre-fork large MAP_PRIVATE + post-fork write
# COW stressor (`--mmapfork` maps MAP_SHARED after fork; `--fork-vm` only calls
# madvise), so these cases measure fork, mprotect, and 64 MiB private-anon VM
# fault/write throughput without mislabeling them as COW.
# ---------------------------------------------------------------------------

[cases."mm.stress.fork.p1"]
group = "stress"
suite = "stress-ng"
binary = "/benchmark/bin/stress-ng"
args = ["--fork", "1", "--timeout", "5s", "--metrics-brief"]
cpus = [0]
parser = "stress_ng_bogo_ops"
unit = "bogo ops/s"
higher_is_better = true

[cases."mm.stress.fork.p1".invariants]
require_vm_balance = true
forbid_migration = true
forbid_thp = true

[cases."mm.stress.fork.p2"]
