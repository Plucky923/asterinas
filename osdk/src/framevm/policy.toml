[host_symbols]
rlibs = [
    "align_ext",
    "aster_framevisor",
    "bitflags",
    "cfg_if",
    "const_format",
    "keyable_arc",
    "lending_iterator",
    "ostd",
    "rand",
    "rand_chacha",
    "rand_core",
    "spin",
]

[validation]
allowed_host_dynamic_prefixes = [
    "align_ext::",
    "aster_framevisor::",
    "bitflags::",
    "cfg_if::",
    "const_format::",
    "keyable_arc::",
    "lending_iterator::",
    "ostd::",
    "ppv_lite86::",
    "rand::",
    "rand_chacha::",
    "rand_core::",
    "spin::",
]
allowed_host_dynamic_contains = [
    " as align_ext::",
    " as aster_framevisor::",
]
non_host_exception_prefixes = [
    "<*const ",
    "<*mut ",
    "<[",
    "<&",
    "alloc::",
    "compiler_builtins::",
    "core::",
    "hashbrown::",
    "rustc_std_workspace_alloc::",
    "rustc_std_workspace_core::",
]
non_host_exception_contains = [
    " as alloc::",
    " as core::",
    " as hashbrown::",
]
raw_exception_symbols = [
    "<f32>::classify",
    "<f64>::classify",
    "__divdf3",
    "__divsf3",
    "__divti3",
    "__gedf2",
    "__gesf2",
    "__ledf2",
    "__lesf2",
    "__ltdf2",
    "__ltsf2",
    "__modti3",
    "__muldf3",
    "__mulsf3",
    "__udivti3",
    "__umodti3",
    "__unorddf2",
    "__unordsf2",
    "__rust_alloc",
    "__rust_alloc_error_handler",
    "__rust_alloc_zeroed",
    "__rust_dealloc",
    "__rust_no_alloc_shim_is_unstable",
    "__rust_realloc",
    "__cpu_local_start",
    "bcmp",
    "memcmp",
    "memcpy",
    "memmove",
    "memset",
    "fmaximum_num",
    "fmaximum_numf",
    "fminimum_num",
    "fminimum_numf",
    "rust_eh_personality",
]
