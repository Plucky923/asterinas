# Declarative Syscall & MM benchmark registry for `poc/eval/`.
# Single source of truth for case commands, CPU pinning, tmpfiles, copy_files, parsers, and fail-closed invariants.

[defaults]
grant_mb = 512
vcpus = 2
rounds = 5
seed = 20261116
timeout_sec = 120

# ---------------------------------------------------------------------------
# Step 0: Fairness & baseline noise self-checks
# ---------------------------------------------------------------------------

[cases."selfcheck.vdso"]
group = "selfcheck"
suite = "selfcheck"
binary = "/bin/vdso_selfcheck"
args = ["--iters", "100000"]
cpus = [0]
parser = "vdso_selfcheck"
unit = "syscalls"
higher_is_better = false

[cases."selfcheck.vdso".invariants]
max_vdso_syscalls = 0
forbid_migration = true
forbid_thp = true

[cases."selfcheck.noop"]
group = "selfcheck"
suite = "selfcheck"
binary = "/bin/true"
args = []
cpus = [0]
parser = "noop_rc"
unit = "rc"
higher_is_better = false

[cases."selfcheck.noop".invariants]
forbid_migration = true
forbid_thp = true

