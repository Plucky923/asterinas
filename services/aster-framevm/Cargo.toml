[package]
name = "aster-framevm"
version = "0.1.0"
edition = "2024"

[lib]
name = "framevm"
path = "src/lib.rs"

[dependencies]
ostd = { path = "../../kernel/comps/framevisor-ostd", package = "aster-framevisor-ostd" }
align_ext = { workspace = true }
aster-block = { path = "comps/block", package = "aster-framevm-block" }
aster-cmdline = { path = "comps/cmdline", package = "aster-framevm-cmdline" }
framev-sock-common = { workspace = true }
aster-softirq = { path = "comps/softirq", package = "aster-framevm-softirq" }
aster-time = { path = "comps/time", package = "aster-framevm-time" }
component = { workspace = true }
controlled = { workspace = true }
framev-device = { workspace = true }
framev-blk-frontend = { workspace = true }
framev-bus = { workspace = true }
framev-console-frontend = { workspace = true }
framev-console-common = { workspace = true }
framev-rng-frontend = { workspace = true }
framev-rng-common = { workspace = true }
framev-sock-frontend = { workspace = true }
aster-rights = { workspace = true }
aster-rights-proc = { workspace = true }
aster-systree = { path = "comps/systree", package = "aster-framevm-systree" }
aster-util = { workspace = true, default-features = false }
atomic-integer-wrapper = { workspace = true }
bitflags = { workspace = true }
bitvec = { workspace = true }
cfg-if = { workspace = true }
const_format = { workspace = true }
device-id = { workspace = true }
hashbrown = { workspace = true }
id-alloc = { workspace = true }
getset = { workspace = true }
inherit-methods-macro = { workspace = true }
intrusive-collections = { workspace = true }
int-to-c-enum = { workspace = true }
io-util = { workspace = true }
jhash = { workspace = true }
keyable-arc = { workspace = true }
lending-iterator = { workspace = true }
logo-ascii-art = { workspace = true }
lru = { workspace = true }
no_std_io2 = { workspace = true }
ostd-pod = { workspace = true }
paste = { workspace = true }
rand = { workspace = true, features = ["std_rng"] }
ring-buffer = { workspace = true }
smallvec = { workspace = true }
spin = { workspace = true }
takeable = { workspace = true }
time = { workspace = true }
typeflags = { workspace = true }
typeflags-util = { workspace = true }
xarray = { workspace = true }
x86_64 = { workspace = true }
xmas-elf = { workspace = true }
zerocopy = { workspace = true }

[features]
default = []

[lints]
workspace = true
