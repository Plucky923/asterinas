# SPDX-License-Identifier: MPL-2.0

service_path = "services/aster-framevm"
kernel_src_path = "kernel/core/src"
facade_path = "kernel/comps/framevisor-ostd"
host_ostd_path = "ostd"
framevisor_backend_device_root = "kernel/comps/framevisor/src/device"
trim_manifest_path = "tools/framevm-service-check/trim-manifest.toml"
component_metadata_path = "Components.toml"
kernel_component_profile = "kernel"
framevm_component_profile = "framevm"

# The service is still being synchronized with the current kernel tree. Enforce
# every FrameVM ownership/facade boundary now, while deferring whole-tree
# source-diff closure until that migration is complete.
source_trim_enforcement = "migration"

entry_trim_files = [
    "src/lib.rs",
    "src/init.rs",
]
forbidden_service_subtrees = [
    "src/service",
]
service_local_module_aliases = [
    "scheduler",
    "fd_table",
    "fs_context",
    "rootfs",
]
host_only_component_packages = [
    "aster-i8042",
    "aster-mlsdisk",
    "aster-uart",
    "aster-virtio",
]

framev_common_crate_roots = [
    "kernel/comps/framev-blk",
    "kernel/comps/framev-console",
    "kernel/comps/framev-net",
    "kernel/comps/framev-rng",
    "kernel/comps/framev-sock",
]

excluded_path_prefixes = [
    "rng",
]
allowed_provider_facade_paths = [
    "FramevisorError",
    "mm::load_total_free_size",
]

[[shared_source_comps]]
name = "pci"
host_source_path = "kernel/core/comps/pci/src"
service_source_path = "services/aster-framevm/comps/pci/src"
service_path_prefix = "../../../../../kernel/core/comps/pci/src"
shared_modules = [
    "bus.rs",
    "capability/mod.rs",
    "cfg_space.rs",
    "common_device.rs",
    "device_info.rs",
]

[[shared_source_comps]]
name = "nvme"
host_source_path = "kernel/core/comps/nvme/src"
service_source_path = "services/aster-framevm/comps/nvme/src"
service_path_prefix = "../../../../../kernel/core/comps/nvme/src"
shared_modules = [
    "device/mod.rs",
    "msix.rs",
    "nvme_cmd.rs",
    "nvme_queue.rs",
    "nvme_regs.rs",
    "nvme_spec.rs",
    "transport/mod.rs",
]

[[shared_source_comps]]
name = "bigtcp"
host_source_path = "kernel/libs/aster-bigtcp/src"
service_source_path = "services/aster-framevm/comps/bigtcp/src"
service_path_prefix = "../../../../../kernel/libs/aster-bigtcp/src"
shared_modules = [
    "boolean_value.rs",
    "device.rs",
    "errors.rs",
    "ext.rs",
    "iface/mod.rs",
    "socket/mod.rs",
    "socket_table.rs",
    "time.rs",
    "wire.rs",
]

[[shared_source_comps]]
name = "network"
host_source_path = "kernel/core/comps/network/src"
service_source_path = "services/aster-framevm/comps/network/src"
service_path_prefix = "../../../../../kernel/core/comps/network/src"
shared_modules = [
    "buffer.rs",
    "dma_pool.rs",
    "driver.rs",
]

[[service_side_trimmed_comps]]
name = "block"
service_path = "services/aster-framevm/comps/block"
kernel_path = "kernel/core/comps/block"
package = "aster-framevm-block"
dependency_key = "aster-block"

[[service_side_trimmed_comps]]
name = "cmdline"
service_path = "services/aster-framevm/comps/cmdline"
kernel_path = "kernel/core/comps/cmdline"
package = "aster-framevm-cmdline"
dependency_key = "aster-cmdline"

[[service_side_trimmed_comps]]
name = "softirq"
service_path = "services/aster-framevm/comps/softirq"
kernel_path = "kernel/core/comps/softirq"
package = "aster-framevm-softirq"
dependency_key = "aster-softirq"

[[service_side_trimmed_comps]]
name = "systree"
service_path = "services/aster-framevm/comps/systree"
kernel_path = "kernel/core/comps/systree"
package = "aster-framevm-systree"
dependency_key = "aster-systree"

[[service_side_trimmed_comps]]
name = "time"
service_path = "services/aster-framevm/comps/time"
kernel_path = "kernel/core/comps/time"
package = "aster-framevm-time"
dependency_key = "aster-time"

[[framev_frontend_crates]]
name = "pci"
path = "services/aster-framevm/comps/framev-pci"
package = "framev-pci"
common_package = "framev-pci-common"
allowed_service_dependencies = []

[[framev_frontend_crates]]
name = "blk"
path = "services/aster-framevm/comps/framev-blk"
package = "framev-blk-frontend"
common_package = "framev-blk-common"
allowed_service_dependencies = ["aster-block"]

[[framev_frontend_crates]]
name = "net"
path = "services/aster-framevm/comps/framev-net"
package = "framev-net-frontend"
common_package = "framev-net-common"
allowed_service_dependencies = []

[[framev_frontend_crates]]
name = "console"
path = "services/aster-framevm/comps/framev-console"
package = "framev-console-frontend"
common_package = "framev-console-common"
allowed_service_dependencies = []

[[framev_frontend_crates]]
name = "rng"
path = "services/aster-framevm/comps/framev-rng"
package = "framev-rng-frontend"
common_package = "framev-rng-common"
allowed_service_dependencies = []

[[framev_frontend_crates]]
name = "sock"
path = "services/aster-framevm/comps/framev-sock"
package = "framev-sock-frontend"
common_package = "framev-sock-common"
allowed_service_dependencies = []
