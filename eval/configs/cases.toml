suite = "stress-ng"
binary = "/benchmark/bin/stress-ng"
args = ["--mmap", "2", "--mmap-bytes", "128M", "--mmap-mprotect", "--timeout", "5s", "--metrics-brief"]
cpus = [0, 1]
parser = "stress_ng_bogo_ops"
unit = "bogo ops/s"
higher_is_better = true

[cases."mm.stress.mmap_mprotect.p2".invariants]
forbid_migration = true
forbid_thp = true

[cases."mm.sng.cow"]
group = "stress"
suite = "stress-ng"
binary = "/benchmark/bin/stress-ng"
args = ["--cow", "1", "--timeout", "5s", "--metrics-brief"]
cpus = [0]
parser = "stress_ng_bogo_ops"
unit = "bogo ops/s"
higher_is_better = true
auto_skip_reason = "COVERAGE GAP: stress-ng 0.18.06 has no --cow stressor (pre-fork large MAP_PRIVATE + post-fork child write); R2 forbids custom benchmark code"

[cases."mm.sng.cow".invariants]
forbid_migration = true
forbid_thp = true
